<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Octubre Juntos</title>
  <meta name="description" content="31 días, 31 recuerdos: un reto de octubre para crear recuerdos en pareja.">
  <meta name="theme-color" content="#2A2A25">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Octubre">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Octubre Juntos</h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="topbar-actions">
        <button class="pill" id="sync-pill" type="button"></button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="content">
      <section class="view" id="view-today"></section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-medals"></section>
    </main>

    <nav class="tabbar" aria-label="Secciones">
      <button class="tab" data-tab="today" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span>Hoy</span>
      </button>
      <button class="tab" data-tab="calendar" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>
        <span>Calendario</span>
      </button>
      <button class="tab" data-tab="medals" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6"/><path d="M8.5 10.2 5 2.5h4.5L12 8l2.5-5.5H19l-3.5 7.7"/></svg>
        <span>Logros</span>
      </button>
    </nav>
  </div>

  <!-- Hoja inferior: detalle de día y ajustes -->
  <div class="overlay" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Editor de recuerdo -->
  <div class="overlay" id="editor" hidden>
    <form class="sheet editor" role="dialog" aria-modal="true" aria-labelledby="editor-heading" novalidate>
      <div class="sheet-head">
        <button class="text-btn" type="button" data-close>Cancelar</button>
        <div class="sheet-title" id="editor-heading">Nuevo recuerdo</div>
        <button class="text-btn strong" type="submit">Guardar</button>
      </div>
      <div class="editor-prompt" id="editor-prompt"></div>
      <label class="field">
        <span>Título (opcional)</span>
        <input type="text" id="editor-title" maxlength="120" placeholder="Dale un título propio" autocomplete="off">
      </label>
      <label class="field">
        <span>Tu recuerdo</span>
        <textarea id="editor-content" rows="6" placeholder="Escribe tu recuerdo, reflexión o la historia detrás de la imagen…"></textarea>
      </label>
      <div class="field">
        <span>Foto, dibujo o video (máx. 30 s)</span>
        <div class="media-picker" id="editor-media"></div>
        <input type="file" id="editor-file" accept="image/*,video/*" hidden>
      </div>
    </form>
  </div>

  <!-- Frase al desbloquear una medalla -->
  <div class="overlay center" id="phrase" hidden>
    <div class="phrase-card" role="dialog" aria-modal="true">
      <div class="phrase-badge">Desbloqueado</div>
      <div class="phrase-icon" id="phrase-icon">💝</div>
      <div class="phrase-name" id="phrase-name"></div>
      <p class="phrase-text" id="phrase-text"></p>
      <button class="btn btn-primary block" type="button" data-close>Guardar en el corazón</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
