<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Octubre Juntos</title>
  <!-- CloudKit JS para sincronización con iCloud -->
  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* Verde Olivo + Paleta Neutra */
      --primary: #8B9D56;           /* Verde olivo medio */
      --primary-light: #A4AC86;      /* Verde olivo claro */
      --primary-dark: #6B7F42;       /* Verde olivo oscuro */
      --success: #9ACD32;            /* Verde lima suave */
      --danger: #C85A54;             /* Terracota suave */
      --warning: #B89968;            /* Ocre cálido */
      --bg-dark: #2A2A25;            /* Gris oscuro neutro */
      --bg-card: #383830;            /* Gris oscuro más claro */
      --bg-hover: #40403A;           /* Gris oscuro hover */
      --border: #4A4A42;             /* Gris neutral medio */
      --border-strong: #5A5A52;      /* Gris neutral más fuerte */
      --text-primary: #F5F5F0;       /* Blanco cálido */
      --text-secondary: #C0C0B8;     /* Gris cálido */
      --text-muted: #8A8A82;         /* Gris más oscuro */
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #A4AC86;
        --primary-light: #B8C299;
        --primary-dark: #8B9D56;
        --success: #9ACD32;
        --danger: #D97C72;
        --warning: #D4B896;
        --bg-dark: #2A2A25;
        --bg-card: #383830;
        --bg-hover: #40403A;
        --border: #4A4A42;
        --border-strong: #5A5A52;
        --text-primary: #F5F5F0;
        --text-secondary: #C0C0B8;
        --text-muted: #8A8A82;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --primary: #A4AC86;
      --primary-light: #B8C299;
      --primary-dark: #8B9D56;
      --success: #9ACD32;
      --danger: #D97C72;
      --warning: #D4B896;
      --bg-dark: #2A2A25;
      --bg-card: #383830;
      --bg-hover: #40403A;
      --border: #4A4A42;
      --border-strong: #5A5A52;
      --text-primary: #F5F5F0;
      --text-secondary: #C0C0B8;
      --text-muted: #8A8A82;
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100%;
    }

    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      text-align: center;
      padding-top: max(16px, env(safe-area-inset-top));
    }

    .header h1 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-dark);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab {
      flex: 1;
      min-width: auto;
      padding: 12px 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--primary);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .view {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0.8; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .today-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .day-badge {
      display: inline-block;
      font-size: 11px;
      color: var(--warning);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      background: rgba(184, 153, 104, 0.15);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .prompt-title {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .prompt-description {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .format-badge {
      display: inline-block;
      background: var(--warning);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-right: 8px;
      margin-bottom: 16px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:active {
      background: var(--border);
    }

    /* Calendar View Controls */
    .calendar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .view-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch-button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .switch-button.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .day-header {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      padding: 8px 0;
      letter-spacing: 0.5px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
    }

    .calendar-day:active {
      transform: scale(0.95);
    }

    .calendar-day.today {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .calendar-day.completed {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .calendar-day.pending {
      background: var(--bg-card);
      border: 2px solid var(--primary);
      color: var(--text-primary);
    }

    /* Feed View */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Instagram Feed View */
    .feed-instagram {
      display: none;
      flex-direction: column;
      gap: 0;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    .feed-instagram.active {
      display: flex;
    }

    .feed-post {
      height: 100vh;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      padding: 0;
    }

    .feed-post-media {
      width: 100%;
      height: 70vh;
      background: var(--bg-card);
      border: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feed-post-media img,
    .feed-post-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .feed-post-media-placeholder {
      font-size: 64px;
    }

    .feed-post-info {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .feed-post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .feed-post-day {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }

    .feed-post-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    .feed-post-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .feed-post-description {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .feed-post-format {
      display: inline-block;
      background: rgba(127, 119, 221, 0.1);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .feed-post-memory {
      background: var(--bg-hover);
      border-left: 3px solid var(--primary);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-primary);
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
    }

    .feed-day {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }

    .feed-day:active {
      border-color: var(--primary);
      transform: scale(0.98);
    }

    .feed-day.today {
      border-color: var(--primary);
      border-width: 2px;
    }

    .feed-day.completed {
      border-color: var(--success);
    }

    .feed-image {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg-hover);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .feed-image img,
    .feed-image video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 8px 12px;
    }

    .feed-day-number {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    .feed-status {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .feed-status.completed {
      color: var(--success);
    }

    .feed-status.today {
      color: var(--primary);
    }

    .status-icon {
      font-size: 14px;
    }

    .feed-prompt {
      padding: 0 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .feed-prompt-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .feed-prompt-description {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .feed-format {
      display: inline-block;
      background: rgba(127, 119, 221, 0.1);
      color: var(--primary);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      width: fit-content;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .achievements-container {
      display: grid;
      gap: 20px;
    }

    .achievement-category {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .category-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .category-title.writing-category {
      color: #60607E;
    }

    .category-title.drawing-category,
    .category-title.multimedia-category {
      color: #B89968;
    }

    .medals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }

    .medal {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
    }

    .medal.unlocked {
      border-color: var(--primary);
      background: rgba(127, 119, 221, 0.05);
      animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .medal:hover {
      transform: scale(1.05);
    }

    .medal-unlocked {
      animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .medal-icon {
      font-size: 32px;
      margin-bottom: 6px;
      opacity: 0.4;
      transition: all 0.3s;
    }

    .medal.unlocked .medal-icon {
      opacity: 1;
      font-size: 40px;
    }

    .medal-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .medal.unlocked .medal-name {
      color: var(--text-primary);
    }

    .medal-progress {
      font-size: 10px;
      color: var(--text-muted);
    }

    .medal.unlocked .medal-progress {
      color: var(--primary);
    }

    .progress-bar {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }

    .progress-fill.complete {
      background: var(--success);
    }


    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 16px;
      color: var(--text-primary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .empty-state p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
      padding-right: 32px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 12px;
    }

    textarea {
      min-height: 120px;
      resize: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    /* Detail View - Instagram Style */
    .detail-view {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .detail-back-button {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .detail-title {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .detail-media-container {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }

    .detail-media-container img,
    .detail-media-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-media-placeholder {
      font-size: 48px;
    }

    .detail-info {
      margin-bottom: 16px;
    }

    .detail-day-badge {
      display: inline-block;
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: rgba(127, 119, 221, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .detail-prompt-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .detail-prompt-description {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .detail-format-badge {
      display: inline-block;
      background: rgba(127, 119, 221, 0.1);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .detail-memory {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .detail-memory-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .detail-memory-content {
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detail-navigation {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .detail-nav-button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .detail-nav-button:active {
      background: var(--bg-hover);
    }

    .detail-nav-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Phrase Modal for Achievements */
    .phrase-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

<body>
  <div class="app">
    <div class="header">
      <div style="display: flex; justify-content: space-between; align-items: center;">

    <div class="tabs">

      </div>

      <!-- Calendario -->

        <!-- Grid View -->

            <div class="day-header">V</div>
            <div class="day-header">S</div>
            <div class="day-header">D</div>

              <div class="legend-box" style="background: var(--primary);"></div>
              <span>Hoy</span>
            </div>
            <div class="legend-item">
              <div class="legend-box" style="background: var(--success);"></div>
              <span>Completado</span>
            </div>

              <span>Pendiente</span>

        </div>
      </div>

      <!-- Logros -->
      <div class="view" id="achievements">

          <div class="stat-card">
            <div class="stat-number" id="stat-unlocked">0</div>
            <div class="stat-label">Medallas</div>
          </div>

          </div>

          </div>
        </div>

      </div>

  <script>

    function showPhraseModal(phrase) {
      document.getElementById('phraseText').textContent = phrase;
      document.getElementById('phraseModal').classList.add('active');

      if (navigator.vibrate) {

      }

    function closePhraseModal() {
      document.getElementById('phraseModal').classList.remove('active');

    // ===== CloudKit Integration =====
    let cloudKitReady = false;
    let iCloudUser = null;
    let cloudKitContainer = null;
    let isCloudKitAvailable = typeof CloudKit !== 'undefined';

    async function initializeCloudKit() {
      if (!isCloudKitAvailable) {
        console.log('CloudKit no disponible, usando localStorage');
        return false;
      }

      try {
        // Configurar el contenedor de CloudKit
        // NOTA: Reemplaza 'iCloud.com.octubreJuntos' con tu Container ID de CloudKit
        // Este ID se obtiene de tu proyecto en Apple Developer Portal
        const container = CloudKit.getDefaultContainer();

        // Configurar credenciales y ambiente
        await container.setUpAuth();

        cloudKitContainer = container;
        const user = await container.fetchCurrentUserIdentity();

        if (user) {
          iCloudUser = user;
          cloudKitReady = true;
          console.log('CloudKit inicializado correctamente');
          return true;
        } else {
          console.log('No hay usuario iCloud autenticado');
          return false;
        }
      } catch (error) {
        console.error('Error inicializando CloudKit:', error);
        cloudKitReady = false;
        return false;
      }
    }

    async function loadDataFromCloudKit() {
      if (!cloudKitReady || !cloudKitContainer) {
        return null;
      }

      try {
        const database = cloudKitContainer.sharedCloudDatabase;

        // Buscar el registro de datos principales
        const query = {
          recordType: 'OctobreData',
          desiredKeys: ['memories', 'completed', 'currentDay', 'promptsByDay']
        };

        const response = await database.performQuery(query);

        if (response.records && response.records.length > 0) {
          const record = response.records[0];
          return {
            memories: record.fields.memories?.value || [],
            completed: record.fields.completed?.value || [],
            currentDay: record.fields.currentDay?.value || 1,
            promptsByDay: record.fields.promptsByDay?.value || {}
          };
        }
        return null;
      } catch (error) {
        console.error('Error cargando datos de CloudKit:', error);
        return null;
      }
    }

    async function saveDataToCloudKit() {
      if (!cloudKitReady || !cloudKitContainer) {
        return false;
      }

      try {
        const database = cloudKitContainer.sharedCloudDatabase;

        const record = {
          recordType: 'OctobreData',
          fields: {
            memories: { value: memories },
            completed: { value: Array.from(completed) },
            currentDay: { value: currentDay },
            promptsByDay: { value: promptsByDay }
          }
        };

        // Intenta actualizar si existe, sino crea uno nuevo
        const response = await database.saveRecords([record]);

        if (response.records && response.records.length > 0) {
          console.log('Datos sincronizados a CloudKit');
          return true;
        }
        return false;
      } catch (error) {
        console.error('Error guardando datos en CloudKit:', error);
        return false;
      }
    }

    async function uploadMediaToCloudKit(mediaData, fileName) {
      if (!cloudKitReady || !cloudKitContainer) {
        return null;
      }

      try {
        const database = cloudKitContainer.sharedCloudDatabase;

        // Convertir base64 a blob si es necesario
        const blob = await fetch(mediaData).then(r => r.blob());

        const asset = new CloudKit.Asset({
          fileContent: blob,
          filename: fileName
        });

        return asset;
      } catch (error) {
        console.error('Error subiendo media a CloudKit:', error);
        return null;
      }
    }

    function init() {
      // Inicializar CloudKit primero
      initializeCloudKit().then(async (cloudKitSuccess) => {
        if (cloudKitSuccess) {
          // Mostrar indicador de CloudKit
          const statusEl = document.getElementById('cloudkit-status');
          if (statusEl) {
            statusEl.style.display = 'block';
            statusEl.style.color = 'var(--success)';
          }

          // Intentar cargar datos de CloudKit
          const cloudData = await loadDataFromCloudKit();
          if (cloudData) {
            memories = cloudData.memories || [];
            completed = new Set(cloudData.completed || []);
            currentDay = cloudData.currentDay || 1;
            promptsByDay = cloudData.promptsByDay || {};
          } else {
            // Si no hay datos en CloudKit, crear datos de ejemplo
            localStorage.removeItem('octoberData');
            loadData();
            assignPromptsForMonth();
            // Guardar en CloudKit
            saveDataToCloudKit();
          }
        } else {
          // Fallback a localStorage si CloudKit no está disponible
          const statusEl = document.getElementById('cloudkit-status');
          if (statusEl) {
            statusEl.textContent = '💾 Local';
            statusEl.style.display = 'block';
            statusEl.style.color = 'var(--text-muted)';
          }

          localStorage.removeItem('octoberData');
          loadData();
          assignPromptsForMonth();
          saveData();
        }

        // Renderizar interfaz
        updateCurrentDate();
        renderToday();
        renderCalendar();
        renderFeed();
        renderAchievements();
      });
    }

    async function loadData() {
      // Primero intenta cargar de CloudKit
      if (cloudKitReady) {
        const cloudData = await loadDataFromCloudKit();
        if (cloudData) {
          memories = cloudData.memories || [];
          completed = new Set(cloudData.completed || []);
          currentDay = cloudData.currentDay || 1;
          promptsByDay = cloudData.promptsByDay || {};
          return;
        }
      }

      // Fallback a localStorage
      const saved = localStorage.getItem('octoberData');
      if (saved) {
        const data = JSON.parse(saved);
        memories = data.memories || [];
        completed = new Set(data.completed || []);
        currentDay = data.currentDay || 1;
        promptsByDay = data.promptsByDay || {};
      } else {
        // Crear datos de ejemplo para prueba de usabilidad
        createSampleData();
      }
    }

    function saveData() {
      const data = {
        memories,
        completed: Array.from(completed),
        currentDay,
        promptsByDay
      };

      // Guardar en localStorage de inmediato (síncrono)
      localStorage.setItem('octoberData', JSON.stringify(data));

      // Guardar en CloudKit en background (asíncrono, sin esperar)
      if (cloudKitReady) {
        saveDataToCloudKit().catch(err => {
          console.error('Error en sincronización CloudKit:', err);
        });
      }
    }

    function assignPromptsForMonth() {
      // Asignar prompts faltantes para completar todo el mes
      for (let i = 1; i <= 31; i++) {
        if (!promptsByDay[i]) {
          promptsByDay[i] = Math.floor(Math.random() * PROMPTS_POOL.length);
        }
      }
      saveData();
    }

    function getPromptForDay(day) {
      const index = promptsByDay[day];
      return PROMPTS_POOL[index];
    }

    function updateCurrentDate() {
      const today = new Date();
      document.getElementById('current-date').textContent =
        today.toLocaleDateString('es-MX', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function switchView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(view).classList.add('active');
      event.target.classList.add('active');
    }

    function setCalendarView(view) {
      calendarView = view;
      document.getElementById('btn-grid').classList.remove('active');
      document.getElementById('btn-feed').classList.remove('active');
      document.getElementById('calendar-grid-container').style.display = 'none';
      document.getElementById('calendar-feed-container').style.display = 'none';
      document.getElementById('calendar-instagram-container').style.display = 'none';

      if (view === 'grid') {
        document.getElementById('btn-grid').classList.add('active');
        document.getElementById('calendar-grid-container').style.display = 'block';
      } else {
        document.getElementById('btn-feed').classList.add('active');
        document.getElementById('calendar-instagram-container').style.display = 'block';
        renderInstagramFeed();
      }
    }

    function renderInstagramFeed() {
      const container = document.getElementById('calendar-instagram');
      const instagramFeed = document.querySelector('.feed-instagram');

      container.innerHTML = '';

      // Asegurar que el contenedor tenga la clase active
      if (instagramFeed) {
        instagramFeed.classList.add('active');
      }

      for (let i = 1; i <= 31; i++) {
        const isCompleted = completed.has(i);
        const isFuture = i > currentDay && !isCompleted;

        if (isFuture) continue; // No mostrar días futuros

        const prompt = getPromptForDay(i);
        if (!prompt) continue; // Saltar si no hay prompt

        const memory = memories.find(m => m.day === i);
        const typeNames = { drawing: 'Dibujo', writing: 'Escritura', multimedia: 'Multimedia' };

        const post = document.createElement('div');
        post.className = 'feed-post';

        // Media
        let mediaHTML = '';
        if (memory && memory.media) {
          const isVideo = memory.media.includes('data:video/');
          if (isVideo) {
            mediaHTML = `<div class="feed-post-media"><video controls><source src="${memory.media}"></video></div>`;
          } else {
            mediaHTML = `<div class="feed-post-media"><img src="${memory.media}"></div>`;
          }
        } else {
          mediaHTML = '<div class="feed-post-media"><div class="feed-post-media-placeholder">📸</div></div>';
        }

        // Info
        let memoryHTML = '';
        if (memory) {
          memoryHTML = `<div class="feed-post-memory">${memory.content}</div>`;
        }

        post.innerHTML = `
          ${mediaHTML}
          <div class="feed-post-info">
            <div class="feed-post-header">
              <span class="feed-post-day">Día ${i}</span>
              <button class="feed-post-close" onclick="closeFeedInstagram()">✕</button>
            </div>
            <div class="feed-post-title">${prompt.title || 'Sin título'}</div>
            <div class="feed-post-description">${prompt.description || ''}</div>
            <div class="feed-post-format">${prompt.emoji || '?'} ${typeNames[prompt.type] || 'Tipo'}</div>
            ${memoryHTML}
          </div>
        `;

        container.appendChild(post);
      }
    }

    function closeFeedInstagram() {
      setCalendarView('grid');
    }

    function renderToday() {
      const prompt = getPromptForDay(currentDay);
      document.getElementById('day-badge').textContent = `Día ${currentDay} de 31`;
      document.getElementById('prompt-title').textContent = prompt.title;
      document.getElementById('prompt-description').textContent = prompt.description;
      const typeNames = { drawing: 'Dibujo', writing: 'Escritura', multimedia: 'Multimedia' };
      document.getElementById('format-badge').textContent = `${prompt.emoji} ${typeNames[prompt.type]}`;
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let i = 1; i <= 31; i++) {
        const day = document.createElement('div');
        day.className = 'calendar-day';
        day.textContent = i;

        const isFuture = i > currentDay && !completed.has(i);

        if (i === currentDay) {
          day.classList.add('today');
        } else if (completed.has(i)) {
          day.classList.add('completed');
        } else {
          day.classList.add('pending');
        }

        // Solo permitir clicks en días no futuros
        if (!isFuture) {
          day.style.cursor = 'pointer';
          day.onclick = () => {
            // Abrir vista Instagram y scroll al día
            setCalendarView('instagram');
            setTimeout(() => {
              const posts = document.querySelectorAll('.feed-post');
              if (posts[i - 1]) {
                posts[i - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            }, 100);
          };
        } else {
          day.style.cursor = 'not-allowed';
          day.style.opacity = '0.6';
        }

        grid.appendChild(day);
      }
    }

    function renderFeed() {
      const feed = document.getElementById('calendar-feed');
      feed.innerHTML = '';
      const typeNames = { drawing: 'Dibujo', writing: 'Escritura', multimedia: 'Multimedia' };

      for (let i = 1; i <= 31; i++) {
        const isToday = i === currentDay;
        const isCompleted = completed.has(i);
        const isFuture = i > currentDay && !isCompleted;
        const prompt = getPromptForDay(i);
        const memory = memories.find(m => m.day === i);

        const card = document.createElement('div');
        card.className = `feed-day ${isToday ? 'today' : ''} ${isCompleted ? 'completed' : ''}`;

        let statusHTML = '';
        if (isCompleted) {
          statusHTML = '<div class="feed-status completed"><span class="status-icon">✓</span></div>';
        } else if (isToday) {
          statusHTML = '<div class="feed-status today"><span class="status-icon">★</span></div>';
        }

        // Obtener imagen del recuerdo
        let imageHTML = '';
        if (memory && memory.media) {
          const isVideo = memory.media.includes('data:video/');
          if (isVideo) {
            imageHTML = `<div class="feed-image"><video><source src="${memory.media}"></video></div>`;
          } else {
            imageHTML = `<div class="feed-image"><img src="${memory.media}" alt="Día ${i}"></div>`;
          }
        } else {
          imageHTML = '<div class="feed-image">📸</div>';
        }

        // Contenido del prompt
        let titleText = isFuture ? '❓ Sorpresa' : prompt.title;
        let descriptionText = isFuture ? 'Descubre el tema cuando llegue este día' : prompt.description;
        let formatText = isFuture ? '🎁 Próximamente' : `${prompt.emoji} ${typeNames[prompt.type]}`;

        card.innerHTML = `
          ${imageHTML}
          <div class="feed-header">
            <span class="feed-day-number">Día ${i}</span>
            ${statusHTML}
          </div>
          <div class="feed-prompt">
            <div class="feed-prompt-title">${titleText}</div>
            <div class="feed-prompt-description">${descriptionText}</div>
            <span class="feed-format">${formatText}</span>
          </div>
        `;

        // Permitir clicks en todos los días
        card.style.cursor = 'pointer';
        card.onclick = () => {
          // Scroll hasta el día específico en la vista Instagram
          setCalendarView('instagram');
          // Scroll al post del día
          setTimeout(() => {
            const posts = document.querySelectorAll('.feed-post');
            if (posts[i - 1]) {
              posts[i - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 100);
        };

        feed.appendChild(card);
      }
    }

    function openDetailView(day) {
      currentDay = day;
      renderDetailView();
      switchView('detail');
    }

    function renderDetailView() {
      const prompt = getPromptForDay(currentDay);
      const memory = memories.find(m => m.day === currentDay);
      const typeNames = { drawing: 'Dibujo', writing: 'Escritura', multimedia: 'Multimedia' };

      // Actualizar header
      document.getElementById('detail-day-title').textContent = `Día ${currentDay}`;

      // Actualizar media
      const mediaContainer = document.getElementById('detail-media-container');
      mediaContainer.innerHTML = '';
      if (memory && memory.media) {
        const isVideo = memory.media.includes('data:video/');
        if (isVideo) {
          const video = document.createElement('video');
          video.src = memory.media;
          video.controls = true;
          mediaContainer.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = memory.media;
          mediaContainer.appendChild(img);
        }
      } else {
        mediaContainer.innerHTML = '<div class="detail-media-placeholder">📸</div>';
      }

      // Actualizar info del prompt
      document.getElementById('detail-day-badge').textContent = `Día ${currentDay} de 31`;
      document.getElementById('detail-prompt-title').textContent = prompt.title;
      document.getElementById('detail-prompt-description').textContent = prompt.description;
      document.getElementById('detail-format-badge').textContent = `${prompt.emoji} ${typeNames[prompt.type]}`;

      // Actualizar recuerdo
      const memoryContainer = document.getElementById('detail-memory-container');
      if (memory) {
        document.getElementById('detail-memory-content').textContent = memory.content;
        memoryContainer.style.display = 'block';
      } else {
        memoryContainer.style.display = 'none';
      }

      // Actualizar botones de navegación
      document.getElementById('detail-prev').disabled = currentDay <= 1;
      document.getElementById('detail-next').disabled = currentDay >= 31;
    }

    function closeDetailView() {
      // Restaurar a la vista de hoy actual del app (no del detail)
      // Buscar el primer día no completado o el 1
      let todayDay = 1;
      for (let i = 1; i <= 31; i++) {
        if (!completed.has(i)) {
          todayDay = i;
          break;
        }
      }
      currentDay = todayDay;
      renderToday();
      renderCalendar();
      renderFeed();
      switchView('today');
    }

    function navigateDetail(direction) {
      const newDay = currentDay + direction;
      if (newDay >= 1 && newDay <= 31 && !completed.has(newDay)) {
        return; // No navegar a días futuros
      }
      if (newDay >= 1 && newDay <= 31) {
        openDetailView(newDay);
      }
    }

    function renderAchievements() {
      const container = document.getElementById('achievements-container');
      container.innerHTML = '';

      let totalUnlocked = 0;

      Object.entries(MEDALS).forEach(([type, medals]) => {
        const category = document.createElement('div');
        category.className = 'achievement-category';

        const typeNames = { drawing: '🎨 Dibujos', writing: '✍️ Escritura', multimedia: '📸 Multimedia' };
        const categoryClass = type === 'writing' ? 'writing-category' : `${type}-category`;
        category.innerHTML = `<div class="category-title ${categoryClass}">${typeNames[type]}</div>`;

        const grid = document.createElement('div');
        grid.className = 'medals-grid';

        medals.forEach(medal => {
          const typeMemories = memories.filter(m => getPromptForDay(m.day).type === type).length;
          const progress = Math.min(typeMemories, medal.checkpoints);
          const unlocked = progress >= medal.checkpoints;

          if (unlocked) totalUnlocked++;

          const medalEl = document.createElement('div');
          medalEl.className = `medal ${unlocked ? 'unlocked' : ''}`;

          // Add onclick handler if medal is unlocked
          let onclickHandler = '';
          if (unlocked && medal.phrase) {
            onclickHandler = `onclick="showPhraseModal('${medal.phrase.replace(/'/g, "\\'")}')"`;
          }

          medalEl.innerHTML = `
            <div class="medal-icon">${medal.icon}</div>
            <div class="medal-name">${medal.name}</div>
            <div class="medal-progress">${progress}/${medal.checkpoints}</div>
            <div class="progress-bar">
              <div class="progress-fill ${unlocked ? 'complete' : ''}" style="width: ${(progress / medal.checkpoints) * 100}%"></div>
            </div>
          `;

          // Set onclick attribute if unlocked
          if (onclickHandler) {
            medalEl.setAttribute('onclick', `showPhraseModal('${medal.phrase.replace(/'/g, "\\'")}')`);
          }

          grid.appendChild(medalEl);
        });

        category.appendChild(grid);
        container.appendChild(category);
      });

      document.getElementById('stat-unlocked').textContent = totalUnlocked;
      document.getElementById('stat-pending').textContent = 12 - totalUnlocked;
      document.getElementById('stat-progress').textContent = Math.round((totalUnlocked / 12) * 100) + '%';
    }

    function updateHistory() {
      const list = document.getElementById('history-list');
      if (memories.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📜</div>
            <h3>Sin recuerdos aún</h3>
            <p>Comienza agregando tu primer recuerdo</p>
          </div>
        `;
        return;
      }

      list.innerHTML = '';
      [...memories].reverse().forEach(memory => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const prompt = getPromptForDay(memory.day);
        const typeNames = { drawing: 'Dibujo', writing: 'Escritura', multimedia: 'Multimedia' };

        let mediaHTML = '';
        if (memory.media) {
          const isVideo = memory.media.includes('data:video/');
          if (isVideo) {
            mediaHTML = `<div class="history-media"><video controls><source src="${memory.media}"></video></div>`;
          } else {
            mediaHTML = `<div class="history-media"><img src="${memory.media}"></div>`;
          }
        }

        item.innerHTML = `
          <div class="history-date">Día ${memory.day}</div>
          <div class="history-title">${memory.title || prompt.title}</div>
          <div class="history-preview">${memory.content}</div>
          ${mediaHTML}
          <div class="history-type">${prompt.emoji} ${typeNames[prompt.type]}</div>
        `;
        list.appendChild(item);
      });
    }

    function openAddMemory() {
      document.getElementById('memory-title').value = '';
      document.getElementById('memory-content').value = '';
      document.getElementById('memory-media').value = '';
      document.getElementById('media-preview').innerHTML = '';
      document.getElementById('modal').classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', function() {
      const mediaInput = document.getElementById('memory-media');
      if (mediaInput) {
        mediaInput.addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
              const preview = document.getElementById('media-preview');
              const isVideo = file.type.startsWith('video/');
              if (isVideo) {
                preview.innerHTML = `<video style="max-width: 100%; border-radius: 8px; margin-bottom: 8px;" controls><source src="${event.target.result}" type="${file.type}"></video>`;
              } else {
                preview.innerHTML = `<img src="${event.target.result}" style="max-width: 100%; border-radius: 8px; margin-bottom: 8px;">`;
              }
            };
            reader.readAsDataURL(file);
          }
        });
      }
    });

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveMemory() {
      const title = document.getElementById('memory-title').value;
      const content = document.getElementById('memory-content').value;
      const mediaInput = document.getElementById('memory-media');

      if (!content.trim()) {
        alert('Por favor escribe algo');
        return;
      }

      const prompt = getPromptForDay(currentDay);
      const memory = {
        day: currentDay,
        title: title || prompt.title,
        content: content,
        date: new Date().toISOString(),
        media: null
      };

      // Procesar archivo media si existe
      if (mediaInput.files && mediaInput.files[0]) {
        const file = mediaInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          memory.media = e.target.result;
          memories.push(memory);
          completed.add(currentDay);
          if (currentDay < 31) {
            currentDay++;
          }
          saveData();
          renderToday();
          renderCalendar();
          renderFeed();
          renderAchievements();
          closeModal();
        };
        reader.readAsDataURL(file);
      } else {
        memories.push(memory);
        completed.add(currentDay);
        if (currentDay < 31) {
          currentDay++;
        }
        saveData();
        renderToday();
        renderCalendar();
        renderFeed();
        renderAchievements();
        closeModal();
      }
    }

    function changePrompt() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * PROMPTS_POOL.length);
      } while (newIndex === promptsByDay[currentDay]);

      promptsByDay[currentDay] = newIndex;
      saveData();
      renderToday();
    }

    // Iniciar
    init();
  </script>
</body>
</html>
